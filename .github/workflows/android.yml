name: Android

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore
        if: ${{ secrets.SMARTDIALER_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SMARTDIALER_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/smartdialer.p12"
          echo "SMARTDIALER_KEYSTORE_FILE=$RUNNER_TEMP/smartdialer.p12" >> "$GITHUB_ENV"
          echo "SMARTDIALER_KEYSTORE_PASSWORD=${{ secrets.SMARTDIALER_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SMARTDIALER_KEY_ALIAS=${{ secrets.SMARTDIALER_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SMARTDIALER_KEY_PASSWORD=${{ secrets.SMARTDIALER_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDialer2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
