name: Android

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SMARTDIALER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SMARTDIALER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMARTDIALER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMARTDIALER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/smartdialer.p12"
            echo "SMARTDIALER_KEYSTORE_FILE=$RUNNER_TEMP/smartdialer.p12" >> "$GITHUB_ENV"
            echo "SMARTDIALER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SMARTDIALER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SMARTDIALER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDialer2-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDialer2-release-apk
          path: app/build/outputs/apk/release/*.apk
